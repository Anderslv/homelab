---
services:
  traefik-dev:
    profiles: [infra, dev]
    image: traefik:3.6.9
    environment:
      TZ: ${TZ:-UTC}
    labels:
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-localhost.me}`)
    networks: [traefik_public]
  traefik:
    profiles: [prod]
    image: traefik:3.6.9
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    networks: [traefik_public]
networks:
  traefik_public:
    name: traefik_public
