---
services:
  alpha-db:
    profiles: [apps, dev, prod]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${ALPHA_DB_PASSWORD:?Set ALPHA_DB_PASSWORD}
    volumes: [alpha_db_data:/var/lib/postgresql/data]
  alpha-web:
    profiles: [apps, dev, prod]
    image: busybox:1.37.0
    depends_on: [alpha-db]
    environment:
      TZ: ${TZ:-UTC}
      API_TOKEN: ${ALPHA_API_TOKEN}
      MODE: ${ALPHA_MODE:-}
volumes:
  alpha_db_data:
