---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# pre-commit.ci configuration
ci:
  autoupdate_schedule: monthly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^home-assistant/configuration\.yaml$
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-json
        files: \.(json)$
  - repo: https://github.com/lyz-code/yamlfix/
    rev: 1.19.1
    hooks:
      - id: yamlfix
        language_version: python3.11
        exclude: ^home-assistant/configuration\.yaml$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: env-example
        name: Check that .env.example matches the compose files
        entry: scripts/secrets/map.sh --check
        language: system
        files: ^(docker-compose(\.pods)?\.yml|services/.*\.yml|home-assistant/docker-compose\.yml|\.env\.example)$
        pass_filenames: false
      - id: forbid-secret-files
        name: Refusing to commit secret material
        language: fail
        entry: These files hold secrets; keep them out of git (see .gitignore)
        files: ^secrets/|(^|/)(\.env(\..*)?|.*\.agekey|.*\.kdbx|.*\.sops\..*|\.sops\.yaml|age-key\.txt|keys\.txt)$
        # The test fixture's copy is the same values-free variable list.
        exclude: ^(dev/tests/secrets/fixture/)?\.env\.example$
      - id: env-example-has-no-values
        name: Check that .env.example holds names only, no values
        language: system
        entry: bash -c '! grep -nE "^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]#]" .env.example'
        files: ^\.env\.example$
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
